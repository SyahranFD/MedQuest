name: gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # routes, typecheck, lint, tests, build: the same script as local (CLAUDE.md section 10)
      - run: npm run gate
      - name: Committed route tree is not stale
        run: git diff --exit-code -- src/routeTree.gen.ts
