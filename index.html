<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/brand/logo-mark.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8faf8" />
    <meta
      name="description"
      content="MedQuest: simulasi pasien interaktif berbahasa Indonesia untuk latihan anamnesis, diagnosis, dan terapi."
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2"
    />
    <title>MedQuest</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('mq-ui') || '{}');
        var l = s && s.state && s.state.locale;
        if (l === 'en' || l === 'id') document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
